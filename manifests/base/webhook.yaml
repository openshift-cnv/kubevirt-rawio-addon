---
apiVersion: v1
kind: Namespace
metadata:
  name: kubevirt-rawio-addon
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rawio-webhook
  namespace: kubevirt-rawio-addon
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rawio-webhook
  namespace: kubevirt-rawio-addon
  labels:
    app: rawio-webhook
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rawio-webhook
  template:
    metadata:
      labels:
        app: rawio-webhook
    spec:
      serviceAccountName: rawio-webhook
      containers:
        - name: webhook
          image: rawio-webhook:latest
          ports:
            - containerPort: 8443
              name: webhook
              protocol: TCP
          env:
            - name: SIDECAR_IMAGE
              value: rawio-sidecar-hook:latest
          volumeMounts:
            - name: tls-certs
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: tls-certs
          secret:
            secretName: rawio-webhook-tls
---
apiVersion: v1
kind: Service
metadata:
  name: rawio-webhook
  namespace: kubevirt-rawio-addon
spec:
  selector:
    app: rawio-webhook
  ports:
    - port: 443
      targetPort: 8443
      protocol: TCP
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: rawio-webhook
webhooks:
  - name: virtualmachineinstances-rawio-mutator.kubevirt.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    clientConfig:
      service:
        name: rawio-webhook
        namespace: kubevirt-rawio-addon
        path: /mutate-vmi
    rules:
      - apiGroups: ["kubevirt.io"]
        apiVersions: ["v1", "v1alpha3"]
        operations: ["CREATE"]
        resources: ["virtualmachineinstances"]
    failurePolicy: Fail
    reinvocationPolicy: IfNeeded
  - name: rawio-pod.kubevirt.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    clientConfig:
      service:
        name: rawio-webhook
        namespace: kubevirt-rawio-addon
        path: /mutate-pod
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
    objectSelector:
      matchExpressions:
        - key: kubevirt.io
          operator: Exists
    failurePolicy: Ignore
    reinvocationPolicy: IfNeeded
