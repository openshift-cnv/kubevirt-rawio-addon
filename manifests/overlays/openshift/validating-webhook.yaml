apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: rawio-webhook-validating
  annotations:
    service.beta.openshift.io/inject-cabundle: "true"
webhooks:
  - name: rawio-pod-scc-validator.kubevirt.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    clientConfig:
      service:
        name: rawio-webhook
        namespace: kubevirt-rawio-addon
        path: /validate-pod
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
    objectSelector:
      matchExpressions:
        - key: kubevirt.io
          operator: Exists
    failurePolicy: Fail
