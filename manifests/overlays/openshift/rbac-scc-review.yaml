apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rawio-webhook-scc-review
rules:
  - apiGroups: ["security.openshift.io"]
    resources: ["podsecuritypolicysubjectreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rawio-webhook-scc-review
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rawio-webhook-scc-review
subjects:
  - kind: ServiceAccount
    name: rawio-webhook
    namespace: kubevirt-rawio-addon
